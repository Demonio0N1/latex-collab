# Compila los instaladores de la app de escritorio en los servidores de GitHub:
#   - Windows: .exe (instalador NSIS)
#   - Linux:   .deb y .AppImage
#   - macOS:   .dmg universal (Apple Silicon + Intel)
#
# Cómo se usa:
#   - Manual: pestaña Actions → "instaladores" → Run workflow.
#     Los instaladores quedan como "artifacts" de esa ejecución.
#   - Publicar versión: git tag v0.2.0 && git push --tags
#     Crea un BORRADOR de Release con los instaladores adjuntos; se publica
#     desde la pestaña Releases.
name: instaladores

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: --bundles nsis
          - platform: ubuntu-24.04
            args: --bundles deb,appimage
          - platform: macos-latest
            args: --bundles dmg --target universal-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          # macOS compila binario universal: necesita ambas arquitecturas.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Dependencias del sistema (Linux)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri

      - name: Dependencias npm (monorepo)
        run: npm ci

      - name: Compilar app e instaladores
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: packages/desktop
          args: ${{ matrix.args }}
          # Solo al subir un tag vX.Y.Z: crea el borrador de Release.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && 'LaTeX Collab __VERSION__' || '' }}
          releaseDraft: true
          releaseBody: |
            Instaladores de LaTeX Collab (app de escritorio).

            - **Windows**: `.exe` — SmartScreen mostrará un aviso (app sin firmar): "Más información" → "Ejecutar de todas formas".
            - **macOS**: `.dmg` universal (Apple Silicon + Intel) — app sin firmar: clic derecho → Abrir la primera vez.
            - **Linux**: `.deb` (Debian/Ubuntu) o `.AppImage` (cualquier distro).

            Cada persona necesita su propio LaTeX en su máquina (TeX Live recomendado) para la vista previa de PDF.

      - name: Subir instaladores como artifacts (ejecución manual)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: instaladores-${{ matrix.platform }}
          path: |
            packages/desktop/src-tauri/target/release/bundle/nsis/*.exe
            packages/desktop/src-tauri/target/release/bundle/deb/*.deb
            packages/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            packages/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
