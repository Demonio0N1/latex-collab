[package]
name = "latex-collab-desktop"
version = "0.1.0"
description = "LaTeX Collab — editor colaborativo de LaTeX autoalojado"
edition = "2021"

[lib]
name = "latex_collab_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "latex-collab-desktop"
path = "src/main.rs"
